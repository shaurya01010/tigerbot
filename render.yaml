services:
  - type: web
    name: tigerbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 app:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ZAPUPI_KEY
        sync: false
      - key: ZAPUPI_WEBHOOK_URL
        sync: false
      - key: PRICE_1D
        value: "20"
      - key: PRICE_7D
        value: "99"
      - key: PRICE_30D
        value: "249"
